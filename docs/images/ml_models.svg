<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="sh">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="600" y="32" text-anchor="middle" fill="#1a1a2e" font-size="22" font-weight="bold">ML Model Pipeline</text>
  <text x="600" y="52" text-anchor="middle" fill="#666" font-size="11">Snowflake Model Registry | Launch + Customer 360 | notebooks/07_ml_models.ipynb</text>

  <rect x="20" y="75" width="220" height="250" rx="8" fill="#eaf7fc" stroke="#29b5e8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="130" y="100" text-anchor="middle" fill="#0e7fad" font-size="12" font-weight="bold">Data Sources</text>
  <text x="130" y="122" text-anchor="middle" fill="#888" font-size="9">ROCKET_LAB_INTELLIGENCE</text>
  <text x="130" y="148" text-anchor="middle" fill="#555" font-size="10">COMPONENT_HEALTH</text>
  <text x="130" y="166" text-anchor="middle" fill="#555" font-size="10">5,000 components</text>
  <text x="130" y="192" text-anchor="middle" fill="#555" font-size="10">ENGINE TELEMETRY</text>
  <text x="130" y="210" text-anchor="middle" fill="#555" font-size="10">150,000 readings</text>
  <text x="130" y="236" text-anchor="middle" fill="#b33f08" font-size="10" font-weight="bold">CUSTOMER_ML_FEATURES</text>
  <text x="130" y="254" text-anchor="middle" fill="#555" font-size="10">Point-in-time snapshots</text>
  <text x="130" y="278" text-anchor="middle" fill="#b33f08" font-size="10" font-weight="bold">100 customers</text>
  <text x="130" y="300" text-anchor="middle" fill="#888" font-size="9">Scores written: 100 rows</text>

  <line x1="240" y1="200" x2="278" y2="200" stroke="#29b5e8" stroke-width="1.5"/>
  <polygon points="276,196 286,200 276,204" fill="#29b5e8"/>

  <rect x="290" y="75" width="250" height="250" rx="8" fill="#f3f0ff" stroke="#7b61ff" stroke-width="1.5" filter="url(#sh)"/>
  <text x="415" y="100" text-anchor="middle" fill="#5a3ec8" font-size="12" font-weight="bold">Feature Engineering</text>
  <text x="415" y="128" text-anchor="middle" fill="#555" font-size="10">Lifecycle ratio, cycles used</text>
  <text x="415" y="148" text-anchor="middle" fill="#555" font-size="10">Telemetry Z-scores</text>
  <text x="415" y="168" text-anchor="middle" fill="#555" font-size="10">Hidden component wear index</text>
  <text x="415" y="192" text-anchor="middle" fill="#555" font-size="10">Customer signals: usage, NPS</text>
  <text x="415" y="210" text-anchor="middle" fill="#555" font-size="10">SLA, tickets, payments</text>
  <text x="415" y="234" text-anchor="middle" fill="#555" font-size="10">180-day forward labels</text>
  <text x="415" y="254" text-anchor="middle" fill="#555" font-size="10">CV grouped by customer</text>
  <text x="415" y="278" text-anchor="middle" fill="#888" font-size="9">Synthetic signals are clean</text>
  <text x="415" y="296" text-anchor="middle" fill="#888" font-size="9">so AUCs are optimistic</text>

  <line x1="540" y1="200" x2="568" y2="200" stroke="#7b61ff" stroke-width="1.5"/>
  <polygon points="566,196 576,200 566,204" fill="#7b61ff"/>

  <rect x="580" y="75" width="600" height="44" rx="6" fill="#eaf7fc" stroke="#29b5e8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="760" y="94" text-anchor="middle" fill="#0e7fad" font-size="12" font-weight="bold">RL_PREDICTIVE_MAINTENANCE</text>
  <text x="1000" y="94" text-anchor="middle" fill="#555" font-size="11">ROC AUC 0.981</text>
  <text x="890" y="110" text-anchor="middle" fill="#888" font-size="9">Will this component fail before the next service window</text>

  <rect x="580" y="129" width="600" height="44" rx="6" fill="#eaf7fc" stroke="#29b5e8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="760" y="148" text-anchor="middle" fill="#0e7fad" font-size="12" font-weight="bold">RL_REMAINING_USEFUL_LIFE</text>
  <text x="1000" y="148" text-anchor="middle" fill="#555" font-size="11">MAE 9.5 cycles</text>
  <text x="890" y="164" text-anchor="middle" fill="#888" font-size="9">R2 0.971 | cycles remaining</text>

  <rect x="580" y="183" width="600" height="44" rx="6" fill="#fff3ed" stroke="#e8530e" stroke-width="1.5" filter="url(#sh)"/>
  <text x="760" y="202" text-anchor="middle" fill="#b33f08" font-size="12" font-weight="bold">RL_CHURN_RISK</text>
  <text x="1000" y="202" text-anchor="middle" fill="#555" font-size="11">Grouped CV AUC 1.000</text>
  <text x="890" y="218" text-anchor="middle" fill="#888" font-size="9">35 customers scored High</text>

  <rect x="580" y="237" width="600" height="44" rx="6" fill="#fff3ed" stroke="#e8530e" stroke-width="1.5" filter="url(#sh)"/>
  <text x="760" y="256" text-anchor="middle" fill="#b33f08" font-size="12" font-weight="bold">RL_CUSTOMER_HEALTH_SCORE</text>
  <text x="1000" y="256" text-anchor="middle" fill="#555" font-size="11">MAE 2.13 | R2 0.928</text>
  <text x="890" y="272" text-anchor="middle" fill="#888" font-size="9">0-100 account health</text>

  <rect x="580" y="291" width="600" height="44" rx="6" fill="#fff3ed" stroke="#e8530e" stroke-width="1.5" filter="url(#sh)"/>
  <text x="760" y="310" text-anchor="middle" fill="#b33f08" font-size="12" font-weight="bold">RL_EXPANSION_PROPENSITY</text>
  <text x="1000" y="310" text-anchor="middle" fill="#555" font-size="11">Grouped CV AUC 1.000</text>
  <text x="890" y="326" text-anchor="middle" fill="#888" font-size="9">Likelihood of a follow-on manifest</text>

  <rect x="20" y="355" width="1160" height="200" rx="10" fill="#f8f9fa" stroke="#dde1e6" stroke-width="1" filter="url(#sh)"/>
  <text x="600" y="382" text-anchor="middle" fill="#1a1a2e" font-size="13" font-weight="bold">How scores reach the agent</text>

  <rect x="40" y="400" width="250" height="120" rx="8" fill="#fff" stroke="#7b61ff" stroke-width="1.5" filter="url(#sh)"/>
  <text x="165" y="430" text-anchor="middle" fill="#5a3ec8" font-size="12" font-weight="bold">Registry V1</text>
  <text x="165" y="454" text-anchor="middle" fill="#555" font-size="10">ROCKET_LAB_INTELLIGENCE.ML</text>
  <text x="165" y="474" text-anchor="middle" fill="#555" font-size="10">All five models at version V1</text>
  <text x="165" y="494" text-anchor="middle" fill="#888" font-size="9">Retrain after step 3</text>

  <line x1="290" y1="460" x2="348" y2="460" stroke="#7b61ff" stroke-width="1.5"/>
  <polygon points="346,456 356,460 346,464" fill="#7b61ff"/>

  <rect x="360" y="400" width="280" height="120" rx="8" fill="#fff" stroke="#e8530e" stroke-width="1.5" filter="url(#sh)"/>
  <text x="500" y="430" text-anchor="middle" fill="#b33f08" font-size="12" font-weight="bold">ANALYTICS.CUSTOMER_ML_SCORES</text>
  <text x="500" y="454" text-anchor="middle" fill="#555" font-size="10">100 rows, one per customer</text>
  <text x="500" y="474" text-anchor="middle" fill="#555" font-size="10">Joined into CUSTOMER_360</text>
  <text x="500" y="494" text-anchor="middle" fill="#888" font-size="9">Wiped if step 3 is rerun</text>

  <line x1="640" y1="460" x2="698" y2="460" stroke="#e8530e" stroke-width="1.5"/>
  <polygon points="696,456 706,460 696,464" fill="#e8530e"/>

  <rect x="710" y="400" width="440" height="120" rx="8" fill="#fff" stroke="#00a843" stroke-width="1.5" filter="url(#sh)"/>
  <text x="930" y="430" text-anchor="middle" fill="#007a31" font-size="12" font-weight="bold">Agent functions</text>
  <text x="930" y="454" text-anchor="middle" fill="#555" font-size="10">Churn list, expansion, account health</text>
  <text x="930" y="474" text-anchor="middle" fill="#555" font-size="10">Component life uses RUL scores</text>
  <text x="930" y="494" text-anchor="middle" fill="#888" font-size="9">ARR at high churn risk: $765.2M</text>

  <text x="600" y="590" text-anchor="middle" fill="#999" font-size="11">Do not treat AUC 1.000 as production performance. Labels were generated from the same hidden profiles as the features.</text>
  <text x="600" y="612" text-anchor="middle" fill="#aaa" font-size="10">Run: python3 notebooks/07_ml_models.py</text>
</svg>
