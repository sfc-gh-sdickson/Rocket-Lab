<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1070" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="sh">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="shLg">
      <feDropShadow dx="2" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#29b5e8"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e8530e"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00a843"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7b61ff"/>
    </marker>
  </defs>

  <rect width="1200" height="1070" fill="#ffffff"/>

  <text x="600" y="40" text-anchor="middle" fill="#1a1a2e" font-size="26" font-weight="bold">Agent Tool Decision Flow</text>
  <text x="600" y="65" text-anchor="middle" fill="#666" font-size="13">How ROCKET_LAB_AGENT Routes Queries to the Right Tool</text>

  <rect x="430" y="90" width="340" height="50" rx="10" fill="#29b5e8" filter="url(#sh)"/>
  <text x="600" y="121" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">User Submits Natural Language Query</text>

  <line x1="600" y1="140" x2="600" y2="170" stroke="#29b5e8" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="400" y="175" width="400" height="55" rx="12" fill="#e8530e" filter="url(#shLg)"/>
  <text x="600" y="200" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">ROCKET_LAB_AGENT</text>
  <text x="600" y="218" text-anchor="middle" fill="#ffe0cc" font-size="11">LLM Orchestrator analyzes intent, context, and keywords</text>

  <line x1="600" y1="230" x2="600" y2="260" stroke="#e8530e" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <polygon points="600,265 750,330 600,395 450,330" fill="#fff8f0" stroke="#e8530e" stroke-width="2" filter="url(#sh)"/>
  <text x="600" y="325" text-anchor="middle" fill="#b33f08" font-size="13" font-weight="bold">Classify</text>
  <text x="600" y="342" text-anchor="middle" fill="#b33f08" font-size="13" font-weight="bold">Query Intent</text>

  <line x1="450" y1="330" x2="195" y2="330" stroke="#7b61ff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <rect x="250" y="310" width="150" height="20" rx="4" fill="#fff"/>
  <text x="325" y="324" text-anchor="middle" fill="#7b61ff" font-size="10" font-weight="bold">Prediction / Score</text>

  <line x1="525" y1="395" x2="330" y2="460" stroke="#29b5e8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="370" y="410" width="130" height="20" rx="4" fill="#fff"/>
  <text x="435" y="424" text-anchor="middle" fill="#29b5e8" font-size="10" font-weight="bold">Data / Metrics / SQL</text>

  <line x1="675" y1="395" x2="870" y2="460" stroke="#00a843" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="700" y="410" width="140" height="20" rx="4" fill="#fff"/>
  <text x="770" y="424" text-anchor="middle" fill="#00a843" font-size="10" font-weight="bold">Docs / Notes / Search</text>

  <line x1="750" y1="330" x2="1005" y2="330" stroke="#e8530e" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <rect x="800" y="310" width="150" height="20" rx="4" fill="#fff"/>
  <text x="875" y="324" text-anchor="middle" fill="#e8530e" font-size="10" font-weight="bold">Known Brief / UDF</text>

  <rect x="20" y="275" width="240" height="110" rx="10" fill="#f3f0ff" stroke="#7b61ff" stroke-width="1.5" filter="url(#sh)"/>
  <text x="140" y="298" text-anchor="middle" fill="#5a3ec8" font-size="13" font-weight="bold">ML Scores</text>
  <line x1="30" y1="306" x2="250" y2="306" stroke="#d4c8ff" stroke-width="1"/>
  <text x="35" y="324" fill="#444" font-size="10">WHEN: "Churn probability..."</text>
  <text x="35" y="340" fill="#444" font-size="10">"Health score for..."</text>
  <text x="35" y="356" fill="#444" font-size="10">"Expansion propensity"</text>
  <text x="35" y="372" fill="#444" font-size="10">"RUL / fail before service"</text>

  <rect x="215" y="465" width="230" height="130" rx="10" fill="#eaf7fc" stroke="#29b5e8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="330" y="488" text-anchor="middle" fill="#0e7fad" font-size="13" font-weight="bold">Cortex Analyst</text>
  <text x="330" y="504" text-anchor="middle" fill="#29b5e8" font-size="10">Text-to-SQL via Semantic View</text>
  <line x1="225" y1="512" x2="435" y2="512" stroke="#b3e5fc" stroke-width="1"/>
  <text x="230" y="530" fill="#444" font-size="10">WHEN: "How many...", "Success rate"</text>
  <text x="230" y="546" fill="#444" font-size="10">"ARR by segment"</text>
  <text x="230" y="562" fill="#444" font-size="10">"Missions by site"</text>
  <text x="230" y="578" fill="#444" font-size="10">"Chart open anomalies"</text>

  <rect x="755" y="465" width="230" height="130" rx="10" fill="#edf9f0" stroke="#00a843" stroke-width="1.5" filter="url(#sh)"/>
  <text x="870" y="488" text-anchor="middle" fill="#007a31" font-size="13" font-weight="bold">Cortex Search</text>
  <text x="870" y="504" text-anchor="middle" fill="#00a843" font-size="10">Documents and notes</text>
  <line x1="765" y1="512" x2="975" y2="512" stroke="#b9f6ca" stroke-width="1"/>
  <text x="770" y="530" fill="#444" font-size="10">WHEN: "What does the playbook..."</text>
  <text x="770" y="546" fill="#444" font-size="10">"Find the recovery notes"</text>
  <text x="770" y="562" fill="#444" font-size="10">"Rutherford hot-fire abort"</text>
  <text x="770" y="578" fill="#444" font-size="10">"What did the QBR say..."</text>

  <rect x="905" y="275" width="275" height="110" rx="10" fill="#fff3ed" stroke="#e8530e" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1043" y="298" text-anchor="middle" fill="#b33f08" font-size="13" font-weight="bold">Custom Tools (UDFs)</text>
  <line x1="915" y1="306" x2="1170" y2="306" stroke="#ffd4bf" stroke-width="1"/>
  <text x="920" y="324" fill="#444" font-size="10">WHEN: "Brief Planet Labs"</text>
  <text x="920" y="340" fill="#444" font-size="10">"Who is most likely to churn"</text>
  <text x="920" y="356" fill="#444" font-size="10">"Renewals in the next 120 days"</text>
  <text x="920" y="372" fill="#444" font-size="10">"Fleet health snapshot"</text>

  <rect x="100" y="630" width="1000" height="260" rx="12" fill="#f8f9fa" stroke="#dde1e6" stroke-width="1" filter="url(#sh)"/>
  <text x="600" y="656" text-anchor="middle" fill="#1a1a2e" font-size="14" font-weight="bold">MULTI-TOOL CHAINING (Complex Queries)</text>
  <text x="600" y="674" text-anchor="middle" fill="#888" font-size="11">Agent chains multiple tools when a single tool cannot fully answer the query</text>

  <rect x="120" y="690" width="460" height="55" rx="8" fill="#fff" stroke="#e8530e" stroke-width="1" filter="url(#sh)"/>
  <text x="135" y="710" fill="#1a1a2e" font-size="11" font-weight="bold">"Brief Planet Labs before the QBR"</text>
  <rect x="135" y="718" width="110" height="18" rx="4" fill="#fff3ed" stroke="#e8530e" stroke-width="0.5"/>
  <text x="190" y="731" text-anchor="middle" fill="#b33f08" font-size="9" font-weight="bold">1. Customer 360</text>
  <text x="255" y="731" fill="#888" font-size="10">&gt;</text>
  <rect x="265" y="718" width="120" height="18" rx="4" fill="#edf9f0" stroke="#00a843" stroke-width="0.5"/>
  <text x="325" y="731" text-anchor="middle" fill="#007a31" font-size="9" font-weight="bold">2. Call notes</text>
  <text x="395" y="731" fill="#888" font-size="10">&gt;</text>
  <rect x="405" y="718" width="90" height="18" rx="4" fill="#eaf7fc" stroke="#29b5e8" stroke-width="0.5"/>
  <text x="450" y="731" text-anchor="middle" fill="#0e7fad" font-size="9" font-weight="bold">3. Analyst</text>

  <rect x="620" y="690" width="460" height="55" rx="8" fill="#fff" stroke="#7b61ff" stroke-width="1" filter="url(#sh)"/>
  <text x="635" y="710" fill="#1a1a2e" font-size="11" font-weight="bold">"Why is this account high churn, and what ARR is at risk?"</text>
  <rect x="635" y="718" width="105" height="18" rx="4" fill="#f3f0ff" stroke="#7b61ff" stroke-width="0.5"/>
  <text x="688" y="731" text-anchor="middle" fill="#5a3ec8" font-size="9" font-weight="bold">1. Churn score</text>
  <text x="750" y="731" fill="#888" font-size="10">&gt;</text>
  <rect x="760" y="718" width="95" height="18" rx="4" fill="#fff3ed" stroke="#e8530e" stroke-width="0.5"/>
  <text x="808" y="731" text-anchor="middle" fill="#b33f08" font-size="9" font-weight="bold">2. Churn list</text>
  <text x="865" y="731" fill="#888" font-size="10">&gt;</text>
  <rect x="875" y="718" width="100" height="18" rx="4" fill="#eaf7fc" stroke="#29b5e8" stroke-width="0.5"/>
  <text x="925" y="731" text-anchor="middle" fill="#0e7fad" font-size="9" font-weight="bold">3. ARR view</text>

  <rect x="120" y="755" width="460" height="55" rx="8" fill="#fff" stroke="#00a843" stroke-width="1" filter="url(#sh)"/>
  <text x="135" y="775" fill="#1a1a2e" font-size="11" font-weight="bold">"What does the playbook say about a hot-fire abort?"</text>
  <rect x="135" y="783" width="140" height="18" rx="4" fill="#edf9f0" stroke="#00a843" stroke-width="0.5"/>
  <text x="205" y="796" text-anchor="middle" fill="#007a31" font-size="9" font-weight="bold">1. Knowledge search</text>
  <text x="285" y="796" fill="#888" font-size="10">&gt;</text>
  <rect x="295" y="783" width="110" height="18" rx="4" fill="#edf9f0" stroke="#00a843" stroke-width="0.5"/>
  <text x="350" y="796" text-anchor="middle" fill="#007a31" font-size="9" font-weight="bold">2. Test failures</text>
  <text x="415" y="796" fill="#888" font-size="10">&gt;</text>
  <rect x="425" y="783" width="100" height="18" rx="4" fill="#eaf7fc" stroke="#29b5e8" stroke-width="0.5"/>
  <text x="475" y="796" text-anchor="middle" fill="#0e7fad" font-size="9" font-weight="bold">3. Anomalies</text>

  <rect x="620" y="755" width="460" height="55" rx="8" fill="#fff" stroke="#29b5e8" stroke-width="1" filter="url(#sh)"/>
  <text x="635" y="775" fill="#1a1a2e" font-size="11" font-weight="bold">"Chart launch success rate by vehicle type"</text>
  <rect x="635" y="783" width="140" height="18" rx="4" fill="#eaf7fc" stroke="#29b5e8" stroke-width="0.5"/>
  <text x="705" y="796" text-anchor="middle" fill="#0e7fad" font-size="9" font-weight="bold">1. Mission Analyst</text>
  <text x="785" y="796" fill="#888" font-size="10">&gt;</text>
  <rect x="795" y="783" width="90" height="18" rx="4" fill="#fff3ed" stroke="#e8530e" stroke-width="0.5"/>
  <text x="840" y="796" text-anchor="middle" fill="#b33f08" font-size="9" font-weight="bold">2. Bar chart</text>

  <rect x="120" y="820" width="460" height="55" rx="8" fill="#fff" stroke="#e8530e" stroke-width="1" filter="url(#sh)"/>
  <text x="135" y="840" fill="#1a1a2e" font-size="11" font-weight="bold">"Which parts are closest to needing replacement?"</text>
  <rect x="135" y="848" width="150" height="18" rx="4" fill="#fff3ed" stroke="#e8530e" stroke-width="0.5"/>
  <text x="210" y="861" text-anchor="middle" fill="#b33f08" font-size="9" font-weight="bold">1. Components at risk</text>
  <text x="295" y="861" fill="#888" font-size="10">&gt;</text>
  <rect x="305" y="848" width="85" height="18" rx="4" fill="#f3f0ff" stroke="#7b61ff" stroke-width="0.5"/>
  <text x="348" y="861" text-anchor="middle" fill="#5a3ec8" font-size="9" font-weight="bold">2. RUL</text>
  <text x="400" y="861" fill="#888" font-size="10">&gt;</text>
  <rect x="410" y="848" width="120" height="18" rx="4" fill="#edf9f0" stroke="#00a843" stroke-width="0.5"/>
  <text x="470" y="861" text-anchor="middle" fill="#007a31" font-size="9" font-weight="bold">3. Supplier notes</text>

  <rect x="620" y="820" width="460" height="55" rx="8" fill="#fff" stroke="#00a843" stroke-width="1" filter="url(#sh)"/>
  <text x="635" y="840" fill="#1a1a2e" font-size="11" font-weight="bold">"Best expansion candidates and their open pipeline"</text>
  <rect x="635" y="848" width="130" height="18" rx="4" fill="#fff3ed" stroke="#e8530e" stroke-width="0.5"/>
  <text x="700" y="861" text-anchor="middle" fill="#b33f08" font-size="9" font-weight="bold">1. Expansion UDF</text>
  <text x="775" y="861" fill="#888" font-size="10">&gt;</text>
  <rect x="785" y="848" width="90" height="18" rx="4" fill="#eaf7fc" stroke="#29b5e8" stroke-width="0.5"/>
  <text x="830" y="861" text-anchor="middle" fill="#0e7fad" font-size="9" font-weight="bold">2. Pipeline</text>
  <text x="885" y="861" fill="#888" font-size="10">&gt;</text>
  <rect x="895" y="848" width="100" height="18" rx="4" fill="#edf9f0" stroke="#00a843" stroke-width="0.5"/>
  <text x="945" y="861" text-anchor="middle" fill="#007a31" font-size="9" font-weight="bold">3. QBR notes</text>

  <rect x="100" y="915" width="1000" height="120" rx="12" fill="#f8f9fa" stroke="#dde1e6" stroke-width="1" filter="url(#sh)"/>
  <text x="600" y="941" text-anchor="middle" fill="#1a1a2e" font-size="14" font-weight="bold">DECISION SIGNALS</text>
  <text x="600" y="959" text-anchor="middle" fill="#888" font-size="11">How the Agent determines which tool to invoke</text>

  <circle cx="155" cy="990" r="8" fill="#7b61ff"/>
  <text x="170" y="995" fill="#444" font-size="11" font-weight="bold">Scores:</text>
  <text x="222" y="995" fill="#666" font-size="10">Churn, health, expansion, remaining useful life</text>

  <circle cx="155" cy="1015" r="8" fill="#29b5e8"/>
  <text x="170" y="1020" fill="#444" font-size="11" font-weight="bold">Analyst:</text>
  <text x="228" y="1020" fill="#666" font-size="10">Counts, rates, ARR, "show me", charts</text>

  <circle cx="650" cy="990" r="8" fill="#00a843"/>
  <text x="665" y="995" fill="#444" font-size="11" font-weight="bold">Search:</text>
  <text x="718" y="995" fill="#666" font-size="10">Playbooks, failure reports, call notes, tickets</text>

  <circle cx="650" cy="1015" r="8" fill="#e8530e"/>
  <text x="665" y="1020" fill="#444" font-size="11" font-weight="bold">UDFs:</text>
  <text x="705" y="1020" fill="#666" font-size="10">Named briefs, churn list, renewals, fleet snapshot</text>

  <text x="600" y="1055" text-anchor="middle" fill="#aaa" font-size="10">Rocket Lab Intelligence Agent | Tool Routing Logic | Powered by Snowflake Cortex</text>
</svg>
