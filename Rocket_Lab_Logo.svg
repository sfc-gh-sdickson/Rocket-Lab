<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1198 443" width="1198" height="443">
	<title>animated-rocket-lab-logo</title>
	<defs>
		<clipPath id="canvas" clipPathUnits="userSpaceOnUse">
			<rect x="0" y="0" width="1198" height="443"/>
		</clipPath>
	</defs>
	<style>
		.wordmark { fill: #000000; }
		.lab { fill: #919498; }
		.rocket { fill: #e42727; }
		.rest-rocket {
			opacity: 1;
			animation: restcycle 30s linear infinite;
		}
		.launching-rocket {
			opacity: 0;
			transform-box: view-box;
			transform-origin: 0px 0px;
			animation: showflight 30s linear infinite, blastoff 30s linear infinite;
		}
		.flames { opacity: 0; animation: ignition 30s linear infinite; }
		@keyframes restcycle {
			0%, 70% { opacity: 1; }
			71%, 94% { opacity: 0; }
			95.4%, 100% { opacity: 1; }
		}
		@keyframes showflight {
			0%, 70% { opacity: 0; }
			71%, 94% { opacity: 1; }
			95.4%, 100% { opacity: 0; }
		}
		@keyframes blastoff {
			0%, 71% { transform: translate(186px, 409px) scale(0.32); }
			74%, 84% { transform: translate(186px, 409px) scale(0.32); }
			86% { transform: translate(186px, 340px) scale(0.32); }
			92% { transform: translate(186px, -300px) scale(0.32); }
			95.3% { transform: translate(186px, -300px) scale(0.32); }
			95.4%, 100% { transform: translate(186px, 409px) scale(0.32); }
		}
		@keyframes ignition {
			0%, 84% { opacity: 0; }
			85% { opacity: 1; }
			92% { opacity: 1; }
			93% { opacity: 0; }
			100% { opacity: 0; }
		}
	</style>
